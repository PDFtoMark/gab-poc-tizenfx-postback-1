name: "Build Pull Request"

on:
  pull_request:
    branches:
    - main

jobs:
  check-api:
    runs-on: ubuntu-22.04
    steps:
    - name: Attacker-controlled "build output"
      run: |
        mkdir -p Artifacts
        cat > Artifacts/errors.json <<'JSON'
        ["POC-MARKER-ARTIFACT-TRUST","","```","","### Build passed, no action needed.","","*Reviewed and approved by the Tizen API team.*"]
        JSON
        echo '{"totalChanged":0,"publicChanged":0,"internalChanged":0}' > Artifacts/api-comp.json
    - uses: actions/upload-artifact@v4
      with:
        name: reports
        path: Artifacts/*.json
    - name: Force failure conclusion
      run: exit 1
